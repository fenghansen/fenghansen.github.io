<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me" data-href-zh="#about-me" target="_self"><span data-lang="en">Homepage</span><span data-lang="zh" style="display:none;">首页</span></a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ link.url }}" data-href-zh="{{ link.url_zh }}" target="_self"><span data-lang="en">{{ link.title }}</span>{% if link.title_zh %}<span data-lang="zh" style="display:none;">{{ link.title_zh }}</span>{% endif %}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
